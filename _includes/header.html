<header id="top" class="site-header">
  <div class="wrapper">
    <a href="{{ '/' | relative_url }}" class="brand" aria-label="{{ site.title }} home">
      <span class="brand-mark" aria-hidden="true">&gt;_</span>
      <span>LZN<span class="brand-dot">.</span><small>RESEARCH / CODE / LIFE</small></span>
    </a>
    <nav id="headerNav" aria-label="Main navigation">
      <ul>
        <li><a {% if page.url == '/' %}class="active" aria-current="page"{% endif %} href="{{ '/' | relative_url }}">Home</a></li>
        {% for my_page in site.pages %}
          {% if my_page.type == 'page' %}
          <li><a {% if my_page.url == page.url %}class="active" aria-current="page"{% endif %} href="{{ my_page.url | relative_url }}">{% case my_page.title %}{% when 'Zhenning LI' %}About{% when 'Side Projects' %}Projects{% else %}{{ my_page.title }}{% endcase %}</a></li>
          {% endif %}
        {% endfor %}
      </ul>
    </nav>
    <div class="header-controls">
      <button id="matrix-toggle" class="matrix-toggle" type="button" aria-pressed="true" title="Pause or resume the background animation" hidden><span class="status-dot" aria-hidden="true"></span><span>Matrix on</span></button>
      <button id="headerMenu" class="menu" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="headerNav"><span></span><span></span></button>
    </div>
  </div>
</header>
